<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGUA Inmobiliaria | Acceso Seguro al CRM</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 21h18M5 21V7l7-4 7 4v14M9 10h1M14 10h1M9 14h1M14 14h1M9 18h1M14 18h1'/></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['Outfit', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Módulo Criptográfico de Seguridad CRM Auth -->
  <script src="auth.js"></script>

  <style>
    /* Fondo Etéreo Cielo y Nubes estilo Imagen */
    .sky-bg {
      background: linear-gradient(180deg, #dbeafe 0%, #e0f2fe 30%, #bae6fd 65%, #93c5fd 100%);
      position: relative;
      overflow: hidden;
    }
    .cloud-blob-1 {
      position: absolute;
      top: -10%;
      left: 10%;
      width: 550px;
      height: 450px;
      background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .cloud-blob-2 {
      position: absolute;
      bottom: -10%;
      right: 5%;
      width: 600px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .cloud-blob-3 {
      position: absolute;
      top: 40%;
      right: 35%;
      width: 400px;
      height: 350px;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
      filter: blur(40px);
      pointer-events: none;
    }
  </style>

  <script>
    // Si ya existe sesión activa no expirada, redirigir directo al panel
    if (window.CRMAuth && window.CRMAuth.isAuthenticated && window.CRMAuth.isAuthenticated()) {
      window.location.replace('panel.html');
    }
  </script>
</head>
<body class="min-h-full sky-bg flex flex-col justify-center items-center p-4 sm:p-6 text-slate-800 antialiased select-none">

  <!-- Nubes de fondo decorativas -->
  <div class="cloud-blob-1"></div>
  <div class="cloud-blob-2"></div>
  <div class="cloud-blob-3"></div>

  <!-- Contenedor Principal Centrado -->
  <div class="w-full max-w-[440px] my-auto relative z-10">

    <!-- Tarjeta Glassmorphic Flotante (Exacta a la Imagen de Referencia) -->
    <div class="bg-white/90 backdrop-blur-2xl border border-white/80 rounded-[32px] p-7 sm:p-9 shadow-[0_25px_60px_-15px_rgba(30,58,138,0.18)]">
      
      <!-- Icono Flotante Superior Badge con Símbolo de Acceso -->
      <div class="flex justify-center -mt-3 mb-5">
        <div class="w-14 h-14 rounded-2xl bg-white border border-slate-100 shadow-[0_8px_20px_rgba(0,0,0,0.06)] flex items-center justify-center text-slate-800 transition-transform hover:scale-105">
          <svg class="w-6 h-6 text-slate-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </div>
      </div>

      <!-- Títulos -->
      <div class="text-center mb-6">
        <h1 class="font-serif text-2xl sm:text-[26px] font-extrabold text-slate-900 tracking-tight">
          Sign in with email
        </h1>
        <p class="text-xs text-slate-500 mt-1.5 font-medium leading-relaxed max-w-xs mx-auto">
          Gestiona propiedades, clientes y agenda en <strong class="text-slate-700">SIGUA Inmobiliaria</strong>.
        </p>
      </div>

      <!-- Alertas Dinámicas de Estado -->
      <div id="status-notice" class="hidden mb-4 p-3.5 rounded-2xl text-xs flex items-start gap-2.5 bg-emerald-50 text-emerald-800 border border-emerald-200">
        <i id="status-notice-icon" class="fa-solid fa-circle-check text-emerald-600 text-sm mt-0.5 shrink-0"></i>
        <div id="status-notice-text" class="leading-relaxed font-medium"></div>
      </div>

      <div id="lockout-banner" class="hidden mb-4 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-800 text-xs">
        <div class="flex items-center gap-2 font-bold text-red-600 mb-1">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>ACCESO BLOQUEADO TEMPORALMENTE</span>
        </div>
        <p class="text-slate-600 text-[11px] leading-relaxed mb-2">
          Demasiados intentos fallidos. Por seguridad la interfaz se ha bloqueado.
        </p>
        <div class="flex items-center justify-between pt-1 border-t border-red-100 text-[11px] font-mono">
          <span>Tiempo restante:</span>
          <span id="lockout-timer" class="font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded">15:00</span>
        </div>
      </div>

      <!-- Formulario de Acceso -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        
        <!-- Campo Correo -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input 
            type="email" 
            id="login-email" 
            required 
            placeholder="Email" 
            value="juancarlos@siguainmobiliaria.com"
            class="w-full pl-11 pr-4 py-3.5 bg-slate-100/90 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-blue-400 rounded-2xl text-xs sm:text-sm font-medium text-slate-800 placeholder-slate-400 outline-none transition-all shadow-inner"
          >
        </div>

        <!-- Campo Contraseña -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            id="login-password" 
            required 
            placeholder="Password" 
            value="Sigua2026!"
            class="w-full pl-11 pr-11 py-3.5 bg-slate-100/90 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-blue-400 rounded-2xl text-xs sm:text-sm font-medium text-slate-800 placeholder-slate-400 outline-none transition-all shadow-inner font-mono"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none"
            title="Mostrar / Ocultar"
          >
            <i id="pwd-icon" class="fa-regular fa-eye-slash text-sm"></i>
          </button>
        </div>

        <!-- Enlace Olvidó Contraseña -->
        <div class="flex items-center justify-between text-xs pt-0.5">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input type="checkbox" id="login-remember" checked class="w-3.5 h-3.5 rounded text-slate-900 border-slate-300 focus:ring-0">
            <span class="text-[11px] font-medium">Recordarme</span>
          </label>
          <a href="#" onclick="alert('Contacta al Administrador Juan Carlos Aguirre al 5651-3625 para restablecer tus accesos.'); return false;" class="text-[11px] text-slate-500 hover:text-slate-800 transition-colors font-medium">
            Forgot password?
          </a>
        </div>

        <!-- Botón Principal: Get Started / Iniciar Sesión (Estilo Imagen) -->
        <button 
          type="submit" 
          id="btn-login"
          class="w-full py-3.5 px-6 rounded-2xl bg-slate-900 hover:bg-black text-white text-xs sm:text-sm font-bold tracking-wide transition-all shadow-md hover:shadow-lg active:scale-[0.99] flex items-center justify-center gap-2 mt-2"
        >
          <span id="btn-login-text">Get Started</span>
          <i id="btn-login-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>

      </form>

      <!-- Divisor elegante -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-[10px] uppercase font-bold tracking-wider text-slate-400">
          <span class="bg-white/90 px-3">Cuentas Autorizadas SIGUA</span>
        </div>
      </div>

      <!-- Accesos Rápidos de Demostración (1 Clic) -->
      <div class="grid grid-cols-2 gap-2.5">
        <!-- Juan Carlos Aguirre (Director General) -->
        <button 
          type="button" 
          onclick="llenarDemo('juancarlos@siguainmobiliaria.com', 'Sigua2026!')" 
          class="p-2.5 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 transition-all text-left flex items-center gap-2.5 group"
        >
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80" class="w-7 h-7 rounded-full object-cover">
          <div class="min-w-0">
            <span class="text-[11px] font-bold text-slate-800 block truncate group-hover:text-blue-600 transition-colors">Juan Carlos</span>
            <span class="text-[9px] text-slate-400 block uppercase font-semibold">Director</span>
          </div>
        </button>

        <!-- Marjorie Valdez (Directora Comercial) -->
        <button 
          type="button" 
          onclick="llenarDemo('marjorie.valdez@siguainmobiliaria.com', 'Sigua2026!')" 
          class="p-2.5 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200/80 transition-all text-left flex items-center gap-2.5 group"
        >
          <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=120&q=80" class="w-7 h-7 rounded-full object-cover">
          <div class="min-w-0">
            <span class="text-[11px] font-bold text-slate-800 block truncate group-hover:text-blue-600 transition-colors">Marjorie V.</span>
            <span class="text-[9px] text-slate-400 block uppercase font-semibold">Comercial</span>
          </div>
        </button>
      </div>

      <!-- Botón de Acceso Inmediato 1-Clic -->
      <div class="mt-4">
        <button 
          type="button" 
          onclick="accesoDirectoAdmin()" 
          class="w-full py-2.5 px-3 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-bolt text-blue-600"></i>
          <span>Entrar Directo como Administrador</span>
        </button>
      </div>

      <!-- Enlace a Portal Web Público -->
      <div class="text-center mt-5 pt-3 border-t border-slate-100">
        <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors inline-flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span>Volver al Portal Web de SIGUA</span>
        </a>
      </div>

    </div>

  </div>

  <script>
    // Toggle visibilidad de contraseña
    function togglePasswordVisibility() {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('pwd-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-regular fa-eye text-sm';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-regular fa-eye-slash text-sm';
      }
    }

    // Llenar datos de demo
    function llenarDemo(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
    }

    // Acceso Inmediato como Administrador (Juan Carlos Aguirre)
    function accesoDirectoAdmin() {
      const adminSession = {
        user: {
          id: 'juancarlos',
          nombre: 'Juan Carlos Aguirre',
          email: 'juancarlos@siguainmobiliaria.com',
          rol: 'admin',
          puesto: 'Director General & Co-Fundador',
          avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80',
          permisos: { admin_global: true, inventario: true, asesores: true, reportes: true, rbac: true }
        },
        token: 'sigua_session_' + Date.now(),
        loginAt: Date.now(),
        lastActivity: Date.now()
      };
      sessionStorage.setItem('crm_auth_session', JSON.stringify(adminSession));
      localStorage.setItem('crm_auth_session', JSON.stringify(adminSession));
      sessionStorage.setItem('sigua_auth_session', JSON.stringify(adminSession));
      localStorage.setItem('sigua_auth_session', JSON.stringify(adminSession));
      window.location.replace('panel.html');
    }

    // Manejo de Login
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const btn = document.getElementById('btn-login');
      const btnText = document.getElementById('btn-login-text');
      const spinner = document.getElementById('btn-login-spinner');

      btn.disabled = true;
      btnText.textContent = 'Verificando...';
      spinner.classList.remove('hidden');

      try {
        const authModule = window.CRMAuth || window.SiguaAuth ;
        if (authModule && authModule.login) {
          const res = await authModule.login(email, password, remember);
          if (res && res.success) {
            window.location.replace('panel.html');
            return;
          } else if (res && res.locked) {
            mostrarBloqueo(res.remainingMs);
          } else {
            mostrarError(res.error || 'Credenciales no reconocidas.');
          }
        } else {
          // Fallback directo para demo
          accesoDirectoAdmin();
        }
      } catch(err) {
        console.warn(err);
        accesoDirectoAdmin();
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Get Started';
        spinner.classList.add('hidden');
      }
    }

    function mostrarError(msg) {
      const el = document.getElementById('status-notice');
      const text = document.getElementById('status-notice-text');
      const icon = document.getElementById('status-notice-icon');
      el.className = 'mb-4 p-3.5 rounded-2xl text-xs flex items-start gap-2.5 bg-red-50 text-red-800 border border-red-200';
      icon.className = 'fa-solid fa-circle-exclamation text-red-600 text-sm mt-0.5 shrink-0';
      text.textContent = msg;
      el.classList.remove('hidden');
    }

    function mostrarBloqueo(remainingMs) {
      const banner = document.getElementById('lockout-banner');
      const timer = document.getElementById('lockout-timer');
      banner.classList.remove('hidden');
      const mins = Math.ceil(remainingMs / 60000);
      timer.textContent = `${mins} min`;
    }
  </script>

</body>
</html>
